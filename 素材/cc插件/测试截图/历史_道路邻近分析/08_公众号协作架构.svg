<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="3080" viewBox="0 0 1080 3080">
<rect width="1080" height="3080" fill="#f1f7f8"/>
<rect x="0" y="0" width="1080" height="220" rx="0" fill="#173e4a"/>
<text x="54" y="30" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="26" font-weight="700" fill="#7eddd0">LINKTOOL / 协作架构</text>
<text x="54" y="78" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="48" font-weight="700" fill="#ffffff">Agent如何连接GIS能力？</text>
<text x="54" y="155" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="29" font-weight="400" fill="#d5e8ed">角色分工 + 工具服务 + 全过程保障</text>
<rect x="54" y="252" width="972" height="122" rx="20" fill="#deefed"/>
<text x="80" y="272" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="35" font-weight="700" fill="#008f88">用户：用自然语言提出需求</text>
<text x="80" y="326" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="30" font-weight="400" fill="#173e4a">分析目标、可用数据、期望成果</text>
<text x="54" y="405" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="36" font-weight="700" fill="#173e4a">01  需求入口与数据摸底</text>
<rect x="54" y="463" width="474" height="244" rx="20" fill="#ffffff"/>
<text x="78" y="481" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="35" font-weight="700" fill="#008f88">任务分类 · 可选入口</text>
<text x="78" y="527" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="27" font-weight="700" fill="#2968ad">@question-classify</text>
<text x="78" y="569" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#57737b">模型配置：Haiku</text>
<text x="78" y="611" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="29" font-weight="400" fill="#173e4a">判断问题类型，选择处理路径</text>
<text x="78" y="665" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="25" font-weight="400" fill="#57737b">按数据情况判断，不预设结论</text>
<rect x="552" y="463" width="474" height="244" rx="20" fill="#ffffff"/>
<text x="576" y="481" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="35" font-weight="700" fill="#008f88">数据检索</text>
<text x="576" y="527" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="27" font-weight="700" fill="#2968ad">@data-retrieval</text>
<text x="576" y="569" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#57737b">模型配置：Sonnet</text>
<text x="576" y="611" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="29" font-weight="400" fill="#173e4a">核对数据结构、范围与属性</text>
<text x="576" y="665" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="25" font-weight="400" fill="#57737b">字段和属性以实际查询为准</text>
<polyline points="540,716 540,742" fill="none" stroke="#008f88" stroke-width="4"/>
<polygon points="540,742 531,728 549,728" fill="#008f88"/>
<rect x="54" y="752" width="972" height="246" rx="20" fill="#ffffff"/>
<text x="78" y="770" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="35" font-weight="700" fill="#008f88">任务规划</text>
<text x="78" y="816" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="27" font-weight="700" fill="#2968ad">@task-plan</text>
<text x="78" y="858" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#57737b">模型配置：Opus</text>
<text x="78" y="900" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="29" font-weight="400" fill="#173e4a">需求分析、任务拆解、工作流编排与子任务调度</text>
<text x="78" y="956" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="25" font-weight="400" fill="#57737b">职责边界：不代替GIS助手直接执行空间计算</text>
<text x="54" y="1034" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="36" font-weight="700" fill="#173e4a">02  专业执行与成果交付</text>
<rect x="54" y="1090" width="474" height="286" rx="20" fill="#ffffff"/>
<text x="78" y="1108" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="35" font-weight="700" fill="#008f88">GIS工具执行</text>
<text x="78" y="1154" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="27" font-weight="700" fill="#2968ad">@gis-tool</text>
<text x="78" y="1196" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#57737b">模型配置：Sonnet</text>
<text x="78" y="1238" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="29" font-weight="400" fill="#173e4a">缓冲、裁剪、叠加与统计</text>
<text x="78" y="1276" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="29" font-weight="400" fill="#173e4a">通过MCP调用专业工具</text>
<text x="78" y="1334" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="25" font-weight="400" fill="#57737b">不以临时代码替代工具调用</text>
<rect x="552" y="1090" width="474" height="286" rx="20" fill="#ffffff"/>
<text x="576" y="1108" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="35" font-weight="700" fill="#008f88">地图制图</text>
<text x="576" y="1154" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="27" font-weight="700" fill="#2968ad">@gis-data-visualisation</text>
<text x="576" y="1196" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#57737b">模型配置：未单独指定</text>
<text x="576" y="1238" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="29" font-weight="400" fill="#173e4a">组织图层、符号与配色</text>
<text x="576" y="1276" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="29" font-weight="400" fill="#173e4a">调用制图服务并检查图件</text>
<text x="576" y="1334" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="25" font-weight="400" fill="#57737b">制图交由专门的工具完成</text>
<rect x="54" y="1400" width="972" height="242" rx="20" fill="#ffffff"/>
<text x="78" y="1418" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="35" font-weight="700" fill="#008f88">报告生成</text>
<text x="78" y="1464" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="27" font-weight="700" fill="#2968ad">@report</text>
<text x="78" y="1506" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#57737b">模型配置：Sonnet</text>
<text x="78" y="1548" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="29" font-weight="400" fill="#173e4a">整理过程报告与评价报告，依据成果形成结论</text>
<text x="78" y="1600" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="25" font-weight="400" fill="#57737b">职责边界：不派生子Agent；数据来自实际工具输出</text>
<rect x="54" y="1666" width="972" height="158" rx="20" fill="#e0ebf8"/>
<text x="80" y="1686" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="35" font-weight="700" fill="#008f88">Workflow工作流 + Skill专业技能</text>
<text x="80" y="1740" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="30" font-weight="400" fill="#173e4a">工作流安排步骤、依赖与交接</text>
<text x="80" y="1780" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="30" font-weight="400" fill="#173e4a">专业技能封装可复用的操作方法</text>
<polyline points="540,1832 540,1860" fill="none" stroke="#008f88" stroke-width="4"/>
<polygon points="540,1860 531,1846 549,1846" fill="#008f88"/>
<text x="54" y="1876" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="36" font-weight="700" fill="#173e4a">03  MCP：统一连接主要工具服务</text>
<rect x="54" y="1940" width="474" height="186" rx="20" fill="#ffffff"/>
<text x="78" y="1955" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="33" font-weight="700" fill="#008f88">空间计算</text>
<text x="78" y="1999" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="27" font-weight="700" fill="#2968ad">arcgis-mcp-server</text>
<text x="78" y="2043" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="25" font-weight="400" fill="#173e4a">工具调用、数据查询与属性获取</text>
<text x="78" y="2086" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#57737b">启动方式：uv</text>
<rect x="552" y="1940" width="474" height="186" rx="20" fill="#ffffff"/>
<text x="576" y="1955" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="33" font-weight="700" fill="#008f88">地图制图</text>
<text x="576" y="1999" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="27" font-weight="700" fill="#2968ad">color-style-mcp</text>
<text x="576" y="2043" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="25" font-weight="400" fill="#173e4a">符号、分级与配色，输出专题图</text>
<text x="576" y="2086" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#57737b">启动方式：uv</text>
<rect x="54" y="2146" width="474" height="186" rx="20" fill="#ffffff"/>
<text x="78" y="2161" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="33" font-weight="700" fill="#008f88">案例知识检索</text>
<text x="78" y="2205" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="27" font-weight="700" fill="#2968ad">knowledge-db</text>
<text x="78" y="2249" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="25" font-weight="400" fill="#173e4a">检索GIS案例知识，辅助选方法</text>
<text x="78" y="2292" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#57737b">启动方式：批处理脚本</text>
<rect x="552" y="2146" width="474" height="186" rx="20" fill="#ffffff"/>
<text x="576" y="2161" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="33" font-weight="700" fill="#008f88">文档搜索</text>
<text x="576" y="2205" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="27" font-weight="700" fill="#2968ad">bing-search</text>
<text x="576" y="2249" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="25" font-weight="400" fill="#173e4a">查找工具文档，辅助确认用法</text>
<text x="576" y="2292" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#57737b">启动方式：npx</text>
<rect x="54" y="2352" width="474" height="186" rx="20" fill="#ffffff"/>
<text x="78" y="2367" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="33" font-weight="700" fill="#008f88">地图服务</text>
<text x="78" y="2411" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="27" font-weight="700" fill="#2968ad">amap-maps</text>
<text x="78" y="2455" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="25" font-weight="400" fill="#173e4a">提供位置、路线等地图查询</text>
<text x="78" y="2498" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#57737b">启动方式：npx</text>
<rect x="552" y="2352" width="474" height="186" rx="20" fill="#ffffff"/>
<text x="576" y="2367" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="33" font-weight="700" fill="#008f88">文档读取</text>
<text x="576" y="2411" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="27" font-weight="700" fill="#2968ad">pdf-reader-mcp</text>
<text x="576" y="2455" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="25" font-weight="400" fill="#173e4a">读取PDF资料，辅助理解文档</text>
<text x="576" y="2498" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#57737b">启动方式：uv</text>
<rect x="54" y="2580" width="972" height="208" rx="20" fill="#deefed"/>
<text x="80" y="2600" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="35" font-weight="700" fill="#008f88">04  Hook：调用过程中的检查机制</text>
<text x="80" y="2654" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="30" font-weight="400" fill="#173e4a">执行前：路径保护、参数检查、数据备份</text>
<text x="80" y="2694" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="30" font-weight="400" fill="#173e4a">执行后：日志记录、结果核查</text>
<text x="80" y="2734" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="30" font-weight="400" fill="#173e4a">历史压缩后：恢复记录，接续分析</text>
<rect x="54" y="2810" width="972" height="128" rx="20" fill="#d6e8f3"/>
<text x="80" y="2830" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="35" font-weight="700" fill="#008f88">成果：分析数据、地图与报告</text>
<text x="80" y="2884" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="30" font-weight="400" fill="#173e4a">可配合Office工具生成Word、Excel、PowerPoint文档</text>
<text x="54" y="2973" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#57737b">图中列示主要服务；模型与服务可按运行环境配置。</text>
<text x="54" y="3018" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#57737b">color-style-mcp在插件中的连接名称为color-style。</text>
</svg>