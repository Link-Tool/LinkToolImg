<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1650" viewBox="0 0 1080 1650">
<rect width="1080" height="1650" fill="#f1f7f8"/>
<rect x="0" y="0" width="1080" height="220" rx="0" fill="#173e4a"/>
<text x="54" y="30" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="26" font-weight="700" fill="#7eddd0">LINKTOOL / CLAUDE CODE 插件</text>
<text x="54" y="78" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="48" font-weight="700" fill="#ffffff">通用分析，图文成果成套交付</text>
<text x="54" y="155" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="29" font-weight="400" fill="#d5e8ed">自然语言需求 → 工作流编排 → 专业计算 → 成果交付</text>
